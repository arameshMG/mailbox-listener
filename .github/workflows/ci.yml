name: CI - Validate Listener

on:
  push:
    branches: [main]

jobs:
  validate-powershell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PowerShell
        shell: pwsh
        run: |
          echo "PowerShell version:"
          $PSVersionTable.PSVersion

      - name: Syntax check
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          $ast = [System.Management.Automation.Language.Parsers]::ParseFile(
              "listerner.ps1",
              [ref]$tokens,
              [ref]$errors,
          )

        if ($errors.Count -gt 0) {
            Write-Host "::error::Syntax errors found in listener.ps1"
            foreach ($e in $errors) {
              Write-Host "::error::$($e.Message) at line $($e.Extent.StartLineNumber)"
